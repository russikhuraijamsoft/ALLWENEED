name: Build and package apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  electron-windows:
    name: Build Electron (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Package Electron (Windows)
        run: |
          npx electron-builder --win --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-artifacts
          path: |
            dist/*.exe
            dist/win-unpacked/**

  electron-linux:
    name: Build Electron (Linux AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libasound2 libxtst6 libatk1.0-0 libgbm-dev

      - name: Package Electron (Linux AppImage)
        run: |
          npx electron-builder --linux AppImage --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux-artifacts
          path: |
            dist/*.AppImage
            dist/linux-unpacked/**

  android-apk:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: Set Android SDK Environment Variables
        run: |
          echo "ANDROID_HOME=${{ runner.temp }}/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${{ runner.temp }}/android-sdk" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm deps
        run: npm install

      - name: Install Capacitor CLI
        run: npm install @capacitor/core @capacitor/cli --no-save

      - name: Build web assets
        run: npm run build

      - name: Prepare Android project (Capacitor)
        run: |
          npx cap sync android || true

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK commandline tools
        run: |
          sudo apt-get update        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK commandline tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip cmdline.zip -d latest
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Accept licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=${ANDROID_SDK_ROOT} || true

      - name: Build Android debug APK
        run: |
          cd android
          ./gradlew assembleDebug -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
